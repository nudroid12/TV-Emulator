name: Build TV Emulator APK

on:
  workflow_run:
    workflows: ['Apply TV Emulator ZIP']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_run'
        with:
          name: tv-emulator-applied-commit
          path: ${{ runner.temp }}/apply-result
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read applied commit
        if: github.event_name == 'workflow_run'
        id: applied
        shell: bash
        run: |
          sha="$(cat "$RUNNER_TEMP/apply-result/applied-commit.txt")"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Apply returned an invalid commit SHA.'
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ steps.applied.outputs.sha || github.sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-read-only: true

      - name: Ensure Android SDK packages are available
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK unavailable}}"
          missing=()
          [[ -s "$sdk/platforms/android-35/android.jar" ]] || missing+=('platforms;android-35')
          [[ -x "$sdk/build-tools/34.0.0/aapt2" ]] || missing+=('build-tools;34.0.0')
          if (( ${#missing[@]} == 0 )); then
            exit 0
          fi
          sdkmanager_bin="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager_bin" ]]; then
            for candidate in "$sdk/cmdline-tools/latest/bin/sdkmanager" "$sdk"/cmdline-tools/*/bin/sdkmanager; do
              if [[ -x "$candidate" ]]; then
                sdkmanager_bin="$candidate"
                break
              fi
            done
          fi
          if [[ -z "$sdkmanager_bin" ]]; then
            echo '::error::Android SDK packages are missing and sdkmanager could not be found.'
            exit 1
          fi
          "$sdkmanager_bin" --sdk_root="$sdk" --install "${missing[@]}"

      - name: Build TV Emulator debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TV-Emulator-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
